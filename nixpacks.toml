# Railway / Nixpacks build configuration.
# Installs a system Chromium for PDF rendering and skips puppeteer's own
# Chromium download during install (we use the system one via puppeteer-core).

[phases.setup]
nixPkgs = ["nodejs_22", "chromium"]

[variables]
PUPPETEER_SKIP_DOWNLOAD = "1"
# pdf.ts auto-discovers Chromium on PATH; set this only to override.
# PUPPETEER_EXECUTABLE_PATH = "/root/.nix-profile/bin/chromium"
